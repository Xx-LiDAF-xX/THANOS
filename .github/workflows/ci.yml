name: Build, test and validate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install archive test backend on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: dotnet restore THANOS.sln --locked-mode
      - run: dotnet build THANOS.sln -c Release --no-restore
      - run: dotnet format THANOS.sln --no-restore --verify-no-changes
      - run: dotnet test THANOS.sln -c Release --no-build --logger trx --results-directory TestResults
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/generate_schemas.py --check
      - run: python -m unittest discover -s tests/input_helpers -v
      - run: python tools/validate_schemas.py
      - run: dotnet publish src/Thanos.Cli -c Release --no-restore --self-contained false -o artifacts/cli
      - run: dotnet publish src/Thanos.Desktop -c Release --no-restore --self-contained false -o artifacts/desktop
      - name: Validate published CLI and package notices
        run: |
          python tools/validate_schemas.py --cli artifacts/cli/kytyfixer.dll
          python tools/package_artifacts.py artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: thanos-phase2-${{ matrix.platform }}
          path: artifacts/THANOS-0.2.0.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.platform }}
          path: TestResults
